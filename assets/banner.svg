<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="margin-bench: can a language model run a plant? Models operate simulated plants through tools, graded by simulation.">
  <rect width="1280" height="640" fill="#0f1419"/>

  <!-- A tank under control: valve, level, setpoint -->
  <g transform="translate(70 96)">
    <path d="M0 40 H128" stroke="#3d4650" stroke-width="16"/>
    <path d="M0 40 H128" stroke="#5aa2ee" stroke-width="4" stroke-dasharray="12 12"/>
    <path d="M44 22 L84 58 V22 L44 58 Z" fill="#171b1f" stroke="#b9c1ca" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64 40 V8 M50 8 A14 14 0 0 1 78 8 Z" fill="#171b1f" stroke="#b9c1ca" stroke-width="3"/>
    <rect x="128" y="20" width="170" height="400" rx="12" fill="#1d2228"/>
    <rect x="132" y="214" width="162" height="202" fill="#2f78c4"/>
    <path d="M132 214 H294" stroke="#5a9fe0" stroke-width="5"/>
    <rect x="134" y="34" width="10" height="180" fill="#2f78c4" opacity="0.7"/>
    <rect x="128" y="20" width="170" height="400" rx="12" fill="none" stroke="#6f7b88" stroke-width="5"/>
    <path d="M118 68 H308" stroke="#e25555" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M118 202 H308" stroke="#eef1f4" stroke-width="3" stroke-dasharray="12 8"/>
  </g>

  <!-- Its trend: the level enters the band and stays below the alarm -->
  <g transform="translate(410 96)">
    <rect x="0" y="190" width="240" height="24" fill="#3987e5" opacity="0.18"/>
    <path d="M0 68 H240" stroke="#e25555" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M0 202 H240" stroke="#eef1f4" stroke-width="3" stroke-dasharray="12 8"/>
    <path d="M0 330 C40 330 52 196 96 186 C124 180 140 208 164 204 C188 200 200 203 240 202" stroke="#3987e5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M96 80 V172" stroke="#3cc43c" stroke-width="4" stroke-linecap="round"/>
    <path d="M86 90 L96 78 L106 90 M86 162 L96 174 L106 162" stroke="#3cc43c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="114" y="134" fill="#3cc43c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">margin</text>
    <path d="M0 420 H240" stroke="#2c343c" stroke-width="2"/>
    <text x="0" y="56" fill="#e25555" font-family="Consolas, Menlo, monospace" font-size="20">alarm</text>
    <text x="0" y="452" fill="#7d8794" font-family="Consolas, Menlo, monospace" font-size="20">plant time</text>
  </g>

  <!-- Wordmark -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="696" y="250" fill="#eef1f4" font-size="84" font-weight="700" letter-spacing="-1">margin-bench</text>
    <text x="698" y="318" fill="#b9c1ca" font-size="34">Can a language model run a plant?</text>
    <text x="698" y="408" fill="#8b95a1" font-size="26">Process control · DSP · electronics</text>
    <text x="698" y="448" fill="#8b95a1" font-size="26">Simulated plants, real tools.</text>
    <text x="698" y="488" fill="#8b95a1" font-size="26">Graded by simulation, never by another model.</text>
  </g>
</svg>
